<style>
        body {
            background-color: #f8f9ff;
            color: #0b1c30;
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .premium-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }
        
        /* Custom radio button styling */
        input[type="radio"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: #f8f9ff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 20px;
            height: 20px;
            border: 2px solid #outline-variant;
            border-radius: 50%;
            display: grid;
            place-content: center;
        }
        
        input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #002045;
        }
        
        input[type="radio"]:checked::before {
            transform: scale(1);
        }
        
        input[type="radio"]:checked {
            border-color: #002045;
        }
        
        .payment-option-card {
            transition: all 0.2s ease-in-out;
        }
        
        .payment-option-card.selected {
            border-color: #002045;
            background-color: #f8f9ff;
            box-shadow: 0 4px 12px rgba(0, 32, 69, 0.08);
        }
    </style>

<!-- Footer component suppressed as per logic for transactional flow (dead-end/checkout) -->
<script>
        // Simple script to handle radio button selection styling
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="payment_method"]');
            const cards = document.querySelectorAll('.payment-option-card');
            
            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Remove selected class from all cards
                    cards.forEach(card => card.classList.remove('selected'));
                    
                    // Add selected class to the parent card of the checked radio
                    if(e.target.checked) {
                        e.target.closest('.payment-option-card').classList.add('selected');
                    }
                });
            });
        });
    </script>
