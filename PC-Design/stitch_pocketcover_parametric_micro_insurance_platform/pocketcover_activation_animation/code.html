<div class="absolute inset-0 w-full h-full opacity-80 mix-blend-multiply" style="display:block;">
<canvas id="shader-canvas-ANIMATION_36" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_36');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

varying vec2 v_texCoord;

// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    float n = snoise(uv * 3.0 + u_time * 0.2);
    
    vec3 color1 = vec3(0.10, 0.21, 0.36); // Royal Blue #1a365d
    vec3 color2 = vec3(0.0, 0.87, 0.64); // Success Green
    
    vec3 finalColor = mix(color1, color2, n * 0.5 + 0.5);
    finalColor *= 0.5 + 0.5 * sin(u_time + uv.x * 10.0);
    
    gl_FragColor = vec4(finalColor * 0.4, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressLine = document.getElementById('progress-line');
            
            // Helper to update step UI
            const updateStepToActive = (stepNum) => {
                const step = document.getElementById(`step-${stepNum}`);
                const iconBox = document.getElementById(`step-${stepNum}-icon-box`);
                const icon = document.getElementById(`step-${stepNum}-icon`);
                const title = document.getElementById(`step-${stepNum}-title`);
                const desc = document.getElementById(`step-${stepNum}-desc`);

                step.classList.remove('opacity-40');
                iconBox.classList.replace('border-outline-variant', 'border-primary');
                iconBox.classList.replace('text-outline', 'text-primary');
                iconBox.classList.add('shadow-sm');
                title.classList.replace('text-on-surface-variant', 'text-primary');
                desc.classList.remove('opacity-0');
                
                if(stepNum === 2) icon.classList.add('animate-spin-slow');
                if(stepNum === 3) icon.classList.add('animate-pulse');
            };

            const updateStepToComplete = (stepNum) => {
                const iconBox = document.getElementById(`step-${stepNum}-icon-box`);
                const icon = document.getElementById(`step-${stepNum}-icon`);
                const title = document.getElementById(`step-${stepNum}-title`);
                
                iconBox.classList.replace('border-primary', 'border-tertiary-fixed-dim');
                iconBox.classList.replace('bg-surface-container-lowest', 'bg-tertiary-fixed-dim/10');
                iconBox.classList.replace('text-primary', 'text-tertiary-container');
                icon.classList.remove('animate-spin-slow');
                icon.textContent = 'check_circle';
                
                title.classList.replace('text-primary', 'text-on-surface');
            };

            // Sequence Timing
            setTimeout(() => {
                // Complete Step 1, Activate Step 2
                updateStepToComplete(1);
                updateStepToActive(2);
                progressLine.style.height = '50%';
            }, 2500);

            setTimeout(() => {
                // Complete Step 2, Activate Step 3
                updateStepToComplete(2);
                updateStepToActive(3);
                progressLine.style.height = '100%';
            }, 5000);

            setTimeout(() => {
                // Complete Step 3, Make LIVE active
                updateStepToComplete(3);
                
                const liveBadge = document.getElementById('live-badge');
                const liveDot = document.getElementById('live-dot');
                const liveText = document.getElementById('live-text');

                liveBadge.classList.replace('bg-surface-container-highest', 'bg-tertiary-fixed-dim/20');
                liveBadge.classList.replace('border-outline-variant/50', 'border-tertiary-fixed-dim/50');
                
                liveDot.classList.replace('bg-outline', 'bg-tertiary-fixed-dim');
                liveDot.classList.add('animate-pulse-live');
                
                liveText.textContent = 'Live';
                liveText.classList.replace('text-on-surface-variant', 'text-tertiary-container');
                liveText.classList.add('font-bold');

                document.getElementById('step-3-icon').classList.remove('animate-pulse');

            }, 7500);
        });
    </script>
